spring.application.name=Feedora
logging.level.root=ERROR
logging.level.java.net.CookieManager=OFF

# In-memory Derby database, so tests never touch the real db/ directory
spring.datasource.url=jdbc:derby:memory:feedora-test;create=true
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.DerbyDialect

# Fixed JWT settings, independent of application-secrets.properties
jwt.secret=test-secret-key-that-is-long-enough-for-hs256-signing-0123456789
jwt.expiration=3600000

feedora.logs.retention-days=30

# The scheduled feed parser would run in the background and hold the feed operation lock
feedora.feed-parser.enabled=false
